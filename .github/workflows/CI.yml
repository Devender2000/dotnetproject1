name: Build dotnet app
on: 
   workflow_dispatch
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
            - uses: actions/checkout@v6
            - name: Setup .NET
              users: actions/setup-dotnet@v6
              with: 
                  dotnet-version: 10.0.x
            - name: Restore dependencies
              run: 
                cd NetflixProject
                dotnet restore
            - name: Bulid
              run:
                cd NetflixProject
                dotnet build --configuration Release
          